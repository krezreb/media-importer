[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "media-importer"
version = "1.0.0"
description = "Import photos and videos from any directory into date-organized libraries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Joseph Beeson" }]
keywords = ["photo", "video", "import", "exif", "raw", "media", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

dependencies = [
    "textual>=0.60",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/krezreb/media-importer"
Issues = "https://github.com/krezreb/media-importer/issues"

[project.scripts]
media-importer = "media_importer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/media_importer"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "Makefile", "SPEC.md", "TECH_SPECS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",
    # Broad excepts are deliberate at the per-file isolation boundaries:
    # one unreadable file must never abort a whole import.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
